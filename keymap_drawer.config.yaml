parse_config:
  # Expand the keymap's macros (config/behavior_macros.h and its includes).
  preprocess: true
  # Labels of the keycodes in `&kp X`.
  zmk_keycode_map:
    # Modifiers
    LEFT_SHIFT: ⇧
    RIGHT_SHIFT: ⇧
    LEFT_CONTROL: ⌃
    RIGHT_CONTROL: ⌃
    LEFT_ALT: ⌥
    RIGHT_ALT: ⌥
    LALT: ⌥
    RALT: ⌥
    LEFT_COMMAND: ⌘
    RIGHT_COMMAND: ⌘
    LEFT_GUI: ⌘
    RIGHT_GUI: ⌘
    # Editing keys, full and short aliases
    RETURN: ⏎
    RET: ⏎
    ENTER: ⏎
    BACKSPACE: ⌫
    BSPC: ⌫
    DELETE: ⌦
    DEL: ⌦
    ESCAPE: ⎋
    ESC: ⎋
    TAB: ⇥
    SPACE: ␣
    INSERT: Ins
    INS: Ins
    # Arrows and navigation
    UP_ARROW: ↑
    DOWN_ARROW: ↓
    LEFT_ARROW: ←
    RIGHT_ARROW: →
    HOME: ⤒
    END: ⤓
    PAGE_UP: ⇞
    PAGE_DOWN: ⇟
    # Keypad digits (the KP_NUMBER_* aliases are unused here)
    KP_N0: '0'
    KP_N1: '1'
    KP_N2: '2'
    KP_N3: '3'
    KP_N4: '4'
    KP_N5: '5'
    KP_N6: '6'
    KP_N7: '7'
    KP_N8: '8'
    KP_N9: '9'
    # Keypad symbols
    KP_PLUS: +
    KP_MINUS: '-'
    KP_ASTERISK: '*'
    KP_SLASH: /
    KP_DOT: .
    KP_EQUAL: '='
    KP_ENTER: ⏎
    # System and special keys
    NON_US_BACKSLASH: \
    NON_US_HASH: '#'
    K_APPLICATION: ☰
    APPLICATION: ☰
    PRINTSCREEN: PrtSc
    PAUSE_BREAK: Pause
    # macOS input source keys: &kp EIJI / &kp KANA at the ends of the base
    # layer's top row. The combos go through hold-taps and are labelled in
    # raw_binding_map.
    LANGUAGE_1: かな
    LANGUAGE_2: 英数
  # Include path of the keymap's own headers and dtsi files.
  zmk_additional_includes:
    - config
  zmk_combos: {}
  # Labels of bindings other than &kp. The &en_* entries between the markers
  # are generated from config/eiji_macros.dtsi by
  # scripts/gen-eiji-drawer-map.py (CI: verify-eiji-sync.yml).
  raw_binding_map:
    # Pointing and system
    "&mkp MB1": 🖱L
    "&mkp MB2": 🖱R
    "&mkp MB3": 🖱M
    "&msc SCRL_LEFT": ⟸
    "&msc SCRL_RIGHT": ⟹
    "&msc SCRL_UP": ⤊
    "&msc SCRL_DOWN": ⤋
    "&bootloader": ⚙ boot
    # === AUTO-GENERATED (scripts/gen-eiji-drawer-map.py from config/eiji_macros.dtsi) — do not edit ===
    # EIJI, then a digit (NUMBER_LAYER)
    "&en_0":      '0'
    "&en_1":      '1'
    "&en_2":      '2'
    "&en_3":      '3'
    "&en_4":      '4'
    "&en_5":      '5'
    "&en_6":      '6'
    "&en_7":      '7'
    "&en_8":      '8'
    "&en_9":      '9'

    # EIJI, then a symbol (SYMBOL1_LAYER)
    "&en_under":  '_'
    "&en_pipe":   '|'
    "&en_amp":    '&'
    "&en_excl":   '!'
    "&en_q":      '?'
    "&en_hash":   '#'
    "&en_comma":  ','
    "&en_dot":    '.'
    "&en_semi":   ';'
    "&en_colon":  ':'
    "&en_at":     '@'
    "&en_dq":     '"'
    "&en_sq":     "'"
    "&en_grave":  '`'
    "&en_slash":  '/'
    "&en_bsl":    '\'

    # EIJI, then a symbol (SYMBOL2_LAYER)
    "&en_caret":  '^'
    "&en_lt":     '<'
    "&en_gt":     '>'
    "&en_lbkt":   '['
    "&en_rbkt":   ']'
    "&en_eq":     '='
    "&en_plus":   '+'
    "&en_minus":  '-'
    "&en_ast":    '*'
    "&en_pct":    '%'
    "&en_dollar": '$'
    "&en_tilde":  '~'
    "&en_lpar":   '('
    "&en_rpar":   ')'
    "&en_lbrc":   '{'
    "&en_rbrc":   '}'
    # === END AUTO-GENERATED ===
    # The taps of the ime_kana / ime_eiji hold-taps (the combos)
    "&kana": かな
    "&eiji": 英数
  # Labels of the modifiers in modifier functions such as LS(LEFT_COMMAND).
  modifier_fn_map:
    left_ctrl: Ctl+
    right_ctrl: Ctl+
    left_shift: Sft+
    right_shift: Sft+
    left_alt: Alt+
    right_alt: AltGr+
    left_gui: Gui+
    right_gui: Gui+
    keycode_combiner: "{mods}{key}"
    mod_combiner: "{mod_1}{mod_2}"

draw_config:
  # Key size. With a physical layout (config/imprint.json) keymap-drawer takes
  # key_h for the width too; key_w only sizes generated layouts (ortho_layout,
  # cols_thumbs_notation).
  key_w: 56
  key_h: 56
  combo_w: 28
  combo_h: 22
  # Few combos: draw them on their layer, not in separate diagrams.
  separate_combo_diagrams: false
  # Curve radius of the combo dendrons.
  arc_radius: 6
  # Fonts of the SVG text; Hiragino Sans and Yu Gothic cover the kana labels.
  svg_extra_style: |
    text { font-family: -apple-system, "Hiragino Sans", "Yu Gothic", sans-serif; }
