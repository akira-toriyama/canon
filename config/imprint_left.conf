# The Imprint Dongle is the split central; the Cyboard shield makes the left half central.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# zmk-lantern (config/west.yml) lights this half's key LEDs only while USB
# powers it and it is in use, plus the boot light, and paints them itself
# from the palette (config/lantern_keys.dtsi): ZMK's underglow stays off, as
# imprint.conf says for every imprint target (the module asserts =n on a half,
# its tick would repaint the strip). CONFIG_LANTERN_BRIGHTNESS (default 16 %)
# is the only knob for the look; the colours come from the palette.

# The module's idle rule (CONFIG_LANTERN_OFF_WHEN_IDLE, default y) reads ZMK's
# activity state: this many milliseconds without a key, sensor or pointing
# input on this half, and its LEDs go dark on USB too, until the next input.
# Five minutes, as the Prospector Dongle's screen (CONFIG_BEACON_SCREEN_OFF_AFTER_S);
# ZMK's default is 30 s. Each half counts for itself. With CONFIG_ZMK_SLEEP=n
# (imprint.conf) the only other thing idle moves in a half is ZMK's battery
# sampling, paused while idle. The module's countdown (CONFIG_LANTERN_COUNTDOWN,
# its default) cuts the same five minutes into stages, one per distinct
# palette colour, the whole half in the next colour at each (the glossary:
# countdown).
CONFIG_ZMK_IDLE_TIMEOUT=300000

# The 1200 baud entry into the UF2 bootloader on this half's CDC ACM port
# (config/cdc_acm_port.dtsi, included by the overlay; zmk-beacon
# src/bootloader_on_1200_baud.c): scripts/flash-dongle.sh imprint_left flashes
# the half without a reset double-tap. SERIAL because USB_CDC_ACM depends on it
# and nothing else on a half turns it on (both UARTE nodes are disabled, so no
# UART driver comes with it); the boot mode retention the module sets is the
# board's already. Here and in imprint_right.conf, not in imprint.conf: the
# Imprint Dongle has all three from its board and imprint_dongle.conf, and a
# changed imprint.conf would move its stamp for nothing. Any program that sets
# the port to 1200 baud reboots the half (CLAUDE.md, Invariants): only
# flash-dongle.sh should.
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_BEACON_BOOTLOADER_ON_1200_BAUD=y
