# The Imprint Dongle is the split central; the Cyboard shield makes the left half central.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# zmk-lantern (config/west.yml) lights this half's key LEDs only while USB
# powers it and it is in use, plus the boot light, and paints them itself
# (config/lantern_keys.dtsi): ZMK's underglow stays off, as imprint.conf says
# for every imprint target (the module asserts =n on a half, its tick would
# repaint the strip). CONFIG_LANTERN_BRIGHTNESS (default 16 %) is the only
# knob for the look; the colours come from the palette.

# The module's idle rule (CONFIG_LANTERN_OFF_WHEN_IDLE, default y) reads ZMK's
# activity state: this many milliseconds without a key, sensor or pointing
# input on this half, and its LEDs go dark on USB too, until the next input.
# Five minutes, as the Prospector Dongle's screen (CONFIG_BEACON_SCREEN_OFF_AFTER_S);
# ZMK's default is 30 s. Each half counts for itself. With CONFIG_ZMK_SLEEP=n
# (imprint.conf) the only other thing idle moves in a half is ZMK's battery
# sampling, paused while idle.
CONFIG_ZMK_IDLE_TIMEOUT=300000

# The picture and the effects (the user's picks on hardware, t-skdt, t-5v1f,
# t-6ttk, t-5hqx; the glossary: effect, intro): every key black while lit, so
# that only the effects light (CONFIG_LANTERN_NO_PICTURE), the countdown off
# with it (its pictures would paint the whole half in a colour every ten
# seconds on the way to the idle dark), and the intro, six seconds in red,
# blue and green from the outer keys to the thumbs, as the boot light and
# whenever a cable is plugged in (CONFIG_LANTERN_INTRO; the boot light's
# length is the intro's, so no CONFIG_LANTERN_BOOT_LIGHT_MS here). The five
# effects the user kept are all built into the image, and the pick
# `scripts/dongle.py effect <name>` hands the Imprint Dongle says which draws
# (the behavior node effect of imprint_behaviors.dtsi; the names: thin-ring,
# disc, stain, cross-ring, beams), without a flash; until the Mac's first pick,
# and whenever the stored pick names none of the five, the half draws the crossing
# ring, the user's highest mark (CONFIG_LANTERN_EFFECT_DEFAULT_CROSS_RING; the
# module's choice LANTERN_EFFECT_DEFAULT). The same lines sit in
# imprint_right.conf: ZMK merges imprint.conf into the Imprint Dongle too,
# which has no keys.
CONFIG_LANTERN_NO_PICTURE=y
CONFIG_LANTERN_COUNTDOWN=n
CONFIG_LANTERN_INTRO=y
CONFIG_LANTERN_THIN_RING=y
CONFIG_LANTERN_DISC=y
CONFIG_LANTERN_STAIN=y
CONFIG_LANTERN_CROSS_RING=y
CONFIG_LANTERN_BEAMS=y
CONFIG_LANTERN_EFFECT_DEFAULT_CROSS_RING=y

# The 1200 baud entry into the UF2 bootloader on this half's CDC ACM port
# (config/cdc_acm_port.dtsi, included by the overlay; zmk-beacon
# src/bootloader_on_1200_baud.c): scripts/flash-dongle.sh imprint_left flashes
# the half without a reset double-tap. SERIAL because USB_CDC_ACM depends on it
# and nothing else on a half turns it on (both UARTE nodes are disabled, so no
# UART driver comes with it); the boot mode retention the module sets is the
# board's already. Here and in imprint_right.conf, not in imprint.conf: the
# Imprint Dongle has all three from its board and imprint_dongle.conf, and a
# changed imprint.conf would move its stamp for nothing. Any program that sets
# the port to 1200 baud reboots the half (CLAUDE.md, Invariants): only
# flash-dongle.sh should.
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_BEACON_BOOTLOADER_ON_1200_BAUD=y
