# The Imprint Dongle is the split central; the Cyboard shield makes the left half central.
CONFIG_ZMK_SPLIT_ROLE_CENTRAL=n

# zmk-lantern (config/west.yml): the key LEDs lit only while USB powers this
# half, plus the boot light. Here and in imprint_right.conf, not in
# imprint.conf, which the Imprint Dongle reads too (its =n stays there); the
# half's conf merges after it and wins. The module asserts the five at build
# time (src/on_usb_power.c says why each): it drives the rail itself, so the
# underglow must not look for the disabled ext_power device (ZMK's
# Kconfig.defaults sets EXT_POWER=y with the underglow), nor switch itself
# with USB or idle, nor start at init with the rail off. The colour is ZMK's
# default (hue 40, saturation 100, brightness 25, solid):
# CONFIG_ZMK_RGB_UNDERGLOW_{HUE,SAT,BRT,EFF}_START change it.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n
