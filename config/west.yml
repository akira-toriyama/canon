manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: Cyboard-DigitalTailor
      url-base: https://github.com/Cyboard-DigitalTailor
    - name: t-ogura
      url-base: https://github.com/t-ogura
    # Additional modules containing boards/shields/custom code can be listed here as well
    # See https://docs.zephyrproject.org/3.2.0/develop/west/manifest.html#projects
  projects:
    # ZMK は main 追従が必須。Cyboard の assimilator-bt（HWv2 版）は新しい Zephyr
    # ハードウェアモデルを要求し、ZMK をタグ固定すると arch.cmake で
    # "Could not find ARCH=cyboard" となり board 解決に失敗する。
    # （ZMK 公式のバージョン固定推奨より、この依存関係を優先する）
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # zmk-keyboards (Cyboard モジュール) は **zephyr-4.1 ブランチ**追従。
    # 2026-07-07 に Cyboard が main の意味を変えた: main = ZMK v0.3.0 pin +
    # assimilator-bt を HWv1 レイアウト（boards/arm/）へ差し戻し（Studio 0.3.0 スタック）。
    # canon は zmk@main（= Zephyr 4.1）追従なので main を引くと HWv1 board になり、
    # cmake が soc Kconfig を生成できず "Kconfig/soc/Kconfig.defconfig not found" で落ちる。
    # Cyboard 自身が west.yml で「ZMK main / Zephyr 4.1 なら zephyr-4.1 ブランチを使え」と
    # 案内している（HWv2 の boards/cyboard/assimilator-bt/board.yml はそちらにある）。
    # 系統決定 2026-07-30（t-wz4k）: zephyr-4.1 維持で確定。dongle shield の
    # forward-port（Cyboard#19・2026-07-28 merge）が受け入れられ、ブランチは
    # features を受けることが実証された。imprint_dongle shield もこの merge 以降
    # upstream 提供（canon ローカル shield は撤去済み — t-19b3）。
    - name: zmk-keyboards
      remote: Cyboard-DigitalTailor
      revision: zephyr-4.1
      import: config/west.yml
    # prospector-zmk-module (t-ogura fork, scanner mode). Two consumers in canon:
    # the Prospector Dongle build (shield prospector_scanner, a BLE observer) and
    # the Imprint Dongle build (CONFIG_ZMK_STATUS_ADVERTISEMENT, the broadcaster).
    # Tag-pinned: v2.2.3 (2026-09-01) states keyboard-side support for ZMK main /
    # Zephyr 4.x; bumps are manual and must re-check the canon patches in
    # patches/modules/prospector-zmk-module/ (applied on top of this tag). `path`
    # keeps the clone under modules/, which scripts/build-zmk.sh already excludes
    # from its rsync --delete sync.
    - name: prospector-zmk-module
      remote: t-ogura
      revision: v2.2.3
      path: modules/prospector-zmk-module
  self:
    path: config
