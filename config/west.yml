manifest:
  remotes:
    - name: zmkfirmware
      url-base: https://github.com/zmkfirmware
    - name: Cyboard-DigitalTailor
      url-base: https://github.com/Cyboard-DigitalTailor
    # The own modules' remote: scripts/stamp.py takes every project under it
    # (`stamp.py pins`), pinned by a full commit SHA, never a branch or tag.
    # The firmware stamp digests the pin's tree id, zmk-west.sh pin checks
    # the clone out at it before every build, and build-zmk.sh --module <dir>
    # builds a local tree in its place. stamp.py reads this file by line:
    # write such a project as the two below, `- name:` first, then remote:,
    # revision: and path: as plain scalars.
    - name: akira-toriyama
      url-base: https://github.com/akira-toriyama
  projects:
    # main, never a release tag: the Cyboard assimilator-bt board uses Zephyr's
    # new hardware model (HWv2), and with ZMK v0.3.0 the build failed in
    # arch.cmake with "Could not find ARCH=cyboard" (2026-05-17).
    - name: zmk
      remote: zmkfirmware
      revision: main
      import: app/west.yml
    # The zephyr-4.1 branch, not main: since 2026-07-07 Cyboard's main pins
    # ZMK v0.3.0 and has the HWv1 assimilator-bt, which fails against zmk@main
    # with "Kconfig/soc/Kconfig.defconfig not found". The HWv2 board and the
    # imprint_dongle shield live on zephyr-4.1 (CLAUDE.md).
    - name: zmk-keyboards
      remote: Cyboard-DigitalTailor
      revision: zephyr-4.1
      import: config/west.yml
    # zmk-beacon (own module): the Prospector Dongle's `prospector` shield and
    # the Imprint Dongle's status broadcaster (CONFIG_BEACON_STATUS_BROADCAST
    # in config/imprint_dongle.conf). Pinned by commit, not by tag, so canon
    # takes a change without a zmk-beacon release; bump the SHA by hand.
    # scripts/build-zmk.sh checks it out at this pin before every build.
    - name: zmk-beacon
      remote: akira-toriyama
      revision: d8fc541071b7e8fc2e8885a10a9444c1bb741b55
      path: modules/zmk-beacon
    # zmk-lantern (own module): the halves' key LEDs, lit only while USB
    # powers the half and it is in use (ZMK's idle state after
    # CONFIG_ZMK_IDLE_TIMEOUT turns them off), and the boot light
    # (config/lantern_rail.dtsi, the underglow and idle lines of
    # imprint_left.conf / imprint_right.conf), and their colour: the
    # palette scripts/dongle.py palette hands the Imprint Dongle, carried
    # to both halves by the palette behavior of config/imprint_behaviors.dtsi
    # (the dongle builds the module's palette side only; its conf sizes the
    # split run queue for a whole palette, six slots). Pinned by
    # commit like zmk-beacon; bump the SHA by hand after a merge there.
    - name: zmk-lantern
      remote: akira-toriyama
      revision: 240680987ce811869a775709e39a566b41eb1876
      path: modules/zmk-lantern
  self:
    path: config
