# Prospector Dongle = the zmk-beacon module's `prospector` shield on
# xiao_ble/nrf52840/zmk. The shield's own boards/shields/prospector/prospector.conf
# carries the display, USB and Bluetooth defaults (it is merged before this
# file, so any line here overrides it). Only what this manifest adds goes here.

# The Cyboard module's imprint shield defaults ZMK_RGB_UNDERGLOW=y module-wide
# (outside its SHIELD_ guard), so every build in this manifest inherits it and
# rgb_underglow.c then #errors without a zmk,underglow chosen node.
CONFIG_ZMK_RGB_UNDERGLOW=n

# The user's v1 (t-dzxf, 2026-09-28): the sprite filling the panel inside a
# 12 px margin, and the keyboard's battery (the mean of the halves) as one HP
# bar in a box along the bottom, over the sprite. The CI / release build has
# no sprite and shows the bar alone.
CONFIG_BEACON_SPRITE_FILL=y
CONFIG_BEACON_READINGS_HP_BAR=y
