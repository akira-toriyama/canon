# zmk-mouse receiver config -- USB trackball dongle (XIAO nRF52840).
#
# Wheel axes -> key taps (see akira-toriyama/zmk-ble-hid-host). The wheel is a
# signed axis that ZMK's stock code-only input-processors can't split by sign,
# so the module turns each tick into a DPAD_* key tap that the keymap's
# zmk,input-processor-behaviors then remaps. Enabling an axis here REMOVES its
# normal scroll (the same signal is repurposed). The two are independent:
# comment one out to keep that axis as scroll.
#
#   WHEEL  = vertical wheel  -> INPUT_BTN_DPAD_UP / INPUT_BTN_DPAD_DOWN
#   HWHEEL = horizontal tilt -> INPUT_BTN_DPAD_LEFT / INPUT_BTN_DPAD_RIGHT
#
# Current setup: only the horizontal tilt is keyed (-> C / D in the keymap). The
# vertical wheel is left OFF so it keeps its normal scroll.
CONFIG_ZMK_BLE_HID_HOST_HWHEEL_AS_KEYS=y
# CONFIG_ZMK_BLE_HID_HOST_WHEEL_AS_KEYS=y   # enable later for vertical-wheel keys

# --- canon 同居でのみ必要な上書き（zmk-mouse 単体には無い） ---
# canon は Cyboard zmk-keyboards module も west で取り込む。その imprint shield の
# Kconfig.defconfig が `config ZMK_RGB_UNDERGLOW default y` を **SHIELD ガード外**で
# 宣言しており workspace 全体（＝この ist ビルドにも）波及する。ist は CONFIG_INPUT/
# POINTING を引くため LED 依存が満たされ RGB が y になるが、受信ドングルに underglow
# ノードは無い → rgb_underglow.c が `#error "A zmk,underglow chosen node must be
# declared"` で落ちる（imprint_dongle は INPUT 無しで依存未充足のため回避）。
# ist には RGB ハードが無いので明示的に切る（Cyboard 由来の stray default を上書き）。
CONFIG_ZMK_RGB_UNDERGLOW=n
