# Read by all three imprint targets: ZMK also reads the conf of each prefix of
# the shield name, here imprint.conf (zmk app/boards/post_boards_shields.cmake).

# Underglow off to save battery. The Cyboard module defaults it to y for every
# build in the manifest (boards/shields/imprint/Kconfig.defconfig).
CONFIG_ZMK_RGB_UNDERGLOW=n

# No deep sleep on the halves (the Cyboard shield defaults ZMK_SLEEP=y, with
# ZMK's 15 min idle timeout): waking from sys_poweroff spends the first key
# press on the GPIO wake trigger, before any firmware runs, so each half lost
# a key after every idle spell. Cost: about 2-4 % of the battery a month,
# connected and idle at ~50 uA. The dongle's shield defaults ZMK_SLEEP=n.
CONFIG_ZMK_SLEEP=n
