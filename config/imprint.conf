# RGB underglow は常時 off 運用 (battery 削減)。upstream Cyboard shield の
# Kconfig.defconfig が default=y のため user-config 側で明示的に無効化する。
# 本ファイルは imprint_left / imprint_right / imprint_dongle 全 shield で
# 読まれる(ZMK の shield prefix 候補機構による)。
CONFIG_ZMK_RGB_UNDERGLOW=n

# BLE connection interval を短く tight に保つ。PC スリープ復帰時に 1 回目の
# キー入力が wake-up 信号に消費される問題への対策(課題1)。
# default は遅延を許容する設定で、低消費電力だが復帰時のレスポンスが鈍い。
# 短い interval + slave latency=0 で常時即応 = 1 回目の打鍵から host へ到達する。
# trade-off: battery 消費が上がる(ユーザー受容済み)。
# peripheral 側プレファレンス。dongle (central) では無視される(影響なし)。
CONFIG_BT_PERIPHERAL_PREF_MIN_INT=6
CONFIG_BT_PERIPHERAL_PREF_MAX_INT=12
CONFIG_BT_PERIPHERAL_PREF_LATENCY=0
CONFIG_BT_PERIPHERAL_PREF_TIMEOUT=200
