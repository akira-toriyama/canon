# Read by every imprint_* target, the Imprint Dongle too: ZMK also reads the
# conf of each shield-name prefix (zmk app/boards/post_boards_shields.cmake).

# Underglow off to save battery. The Cyboard module defaults it to y for every
# build in the manifest (boards/shields/imprint/Kconfig.defconfig).
CONFIG_ZMK_RGB_UNDERGLOW=n

# No deep sleep on the halves (the Cyboard shield defaults ZMK_SLEEP=y, with
# ZMK's 15 min idle timeout): waking from sys_poweroff spends the first key
# press on the GPIO wake trigger, before any firmware runs, so each half lost
# a key after every idle spell. Cost: an idle half stays awake and connected:
# 0.79 mA on the left half with the EXT_POWER rail forced off (measured
# 2026-09-15/16 in a throwaway diagnostic build, whose USB logging and 100 ms
# timer only add to it; the shipping build is unmeasured: projects t-2txn,
# e-qch3). The dongle's shield defaults ZMK_SLEEP=n.
CONFIG_ZMK_SLEEP=n
