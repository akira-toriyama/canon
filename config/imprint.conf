# RGB underglow は常時 off 運用 (battery 削減)。upstream Cyboard shield の
# Kconfig.defconfig が default=y のため user-config 側で明示的に無効化する。
# 本ファイルは imprint_left / imprint_right / imprint_dongle 全 shield で
# 読まれる(ZMK の shield prefix 候補機構による)。
CONFIG_ZMK_RGB_UNDERGLOW=n

# BLE 接続パラメータは Zephyr default に戻して battery を取り戻す
# (#41 で導入した tight 設定は priming patch 投入後の検証で外して計測中)。
# 1 打目消失は patches/zmk/usb-hid-prime-on-ready.patch で吸収しているため
# tight 化は不要のはず、を実機で確認する。
