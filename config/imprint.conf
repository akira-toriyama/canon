# RGB underglow は常時 off 運用 (battery 削減)。upstream Cyboard shield の
# Kconfig.defconfig が default=y のため user-config 側で明示的に無効化する。
# 本ファイルは imprint_left / imprint_right / imprint_dongle 全 shield で
# 読まれる(ZMK の shield prefix 候補機構による)。
CONFIG_ZMK_RGB_UNDERGLOW=n

# BLE 接続パラメータは Zephyr default に戻して battery を取り戻す
# (#41 で導入した tight 設定は priming patch 投入後の検証で外して計測中)。
# 1 打目消失は patches/zmk/usb-hid-prime-on-ready.patch で吸収しているため
# tight 化は不要のはず、を実機で確認する。

# 半体の deep sleep (sys_poweroff) を全廃する (Cyboard shield 既定は y /
# 15 分)。電源断からの復帰は 1 打目が GPIO wake トリガーに物理的に消費
# される (firmware 非稼働中は記録不能) ため、離席 >15 分ごとに左右各
# 1 打が消えていた。USB 給電時 (有線運用) は元々 sleep しないので、
# dongle 化 (電池駆動化) で初めて顕在化した症状。sleep を切ると有線時代
# と同じ挙動になる。
# 電池影響: 常時 connected-idle (~50µA) でも待機消費は月 2〜4% 程度。
# 備考: #41 で「=n だと peripheral が起動しない」と判断したが、当時は
# flash 成否の検証手段が無く、flash 破損 (起動しない壊れ app) の誤診
# だった疑いがある。検証付き flash で再テストする。
# dongle は shield Kconfig.defconfig で ZMK_SLEEP=n のため影響なし。
CONFIG_ZMK_SLEEP=n
