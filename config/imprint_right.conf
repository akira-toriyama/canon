# zmk-lantern (config/west.yml): the key LEDs lit only while USB powers this
# half, plus the boot light. The same five lines as imprint_left.conf, which
# says why each; they cannot live in imprint.conf, which the Imprint Dongle
# reads too (its =n stays there), and this file merges after it and wins.
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_USB=n
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=n
CONFIG_ZMK_RGB_UNDERGLOW_ON_START=n

# The 1200 baud entry into the UF2 bootloader on this half's CDC ACM port
# (config/cdc_acm_port.dtsi): the same three lines as imprint_left.conf, which
# says why each, for scripts/flash-dongle.sh imprint_right.
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_BEACON_BOOTLOADER_ON_1200_BAUD=y
