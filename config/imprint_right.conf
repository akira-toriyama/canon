# zmk-lantern (config/west.yml): the key LEDs lit only while USB powers this
# half and it is in use, plus the boot light, painted by the module
# (config/lantern_keys.dtsi); imprint_left.conf says why ZMK's underglow
# stays off and what the idle line is.
CONFIG_ZMK_IDLE_TIMEOUT=300000

# The picture and the effects: the same lines as imprint_left.conf, which
# says what each is for (the no picture, the countdown off, the intro, the
# seven effects built in and the crossing ring as the default pick).
CONFIG_LANTERN_NO_PICTURE=y
CONFIG_LANTERN_COUNTDOWN=n
CONFIG_LANTERN_INTRO=y
CONFIG_LANTERN_THIN_RING=y
CONFIG_LANTERN_DISC=y
CONFIG_LANTERN_STAIN=y
CONFIG_LANTERN_CROSS_RING=y
CONFIG_LANTERN_BEAMS=y
CONFIG_LANTERN_WATER=y
CONFIG_LANTERN_DART=y
CONFIG_LANTERN_EFFECT_DEFAULT_CROSS_RING=y

# The 1200 baud entry into the UF2 bootloader on this half's CDC ACM port
# (config/cdc_acm_port.dtsi): the same three lines as imprint_left.conf, which
# says why each, for scripts/flash-dongle.sh imprint_right.
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_BEACON_BOOTLOADER_ON_1200_BAUD=y
