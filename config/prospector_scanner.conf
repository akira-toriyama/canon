# Prospector Dongle = t-ogura prospector_scanner shield on xiao_ble/nrf52840/zmk.
# A BLE observer that renders the Imprint Dongle's status advertisement
# (CONFIG_ZMK_STATUS_ADVERTISEMENT on the imprint_dongle build). It never pairs
# or connects, so nothing here touches the split link or the chord contract.
# Mirrors config/prospector_scanner.conf of t-ogura/zmk-config-prospector
# (v2.2.3) except for the hardware section at the bottom.

# ============== Display ==============
CONFIG_ZMK_DISPLAY=y
CONFIG_DISPLAY=y
CONFIG_LVGL=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
CONFIG_LV_Z_MEM_POOL_SIZE=49152
CONFIG_LV_Z_DOUBLE_VDB=y
CONFIG_LV_Z_VDB_SIZE=30
CONFIG_ZMK_DISPLAY_WORK_QUEUE_DEDICATED=y
CONFIG_ZMK_DISPLAY_DEDICATED_THREAD_STACK_SIZE=16384
CONFIG_MAIN_STACK_SIZE=4096
# FPU registers are shared across threads (display + BLE); without this the
# context switch corrupts them.
CONFIG_FPU_SHARING=y
CONFIG_GPIO=y

# ============== LVGL widgets / fonts used by the layouts ==============
CONFIG_LV_USE_LABEL=y
CONFIG_LV_USE_BAR=y
CONFIG_LV_USE_FLEX=y
CONFIG_LV_USE_ARC=y
CONFIG_LV_USE_CANVAS=y
CONFIG_LV_USE_IMAGE=y
CONFIG_LV_USE_SLIDER=y
CONFIG_LV_USE_SWITCH=y
CONFIG_LV_USE_BUTTON=y
CONFIG_LV_FONT_MONTSERRAT_12=y
CONFIG_LV_FONT_MONTSERRAT_16=y
CONFIG_LV_FONT_MONTSERRAT_18=y
CONFIG_LV_FONT_MONTSERRAT_20=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_DEFAULT_MONTSERRAT_20=y
CONFIG_LV_FONT_UNSCII_8=y
CONFIG_LV_FONT_UNSCII_16=y

# ============== Scanner mode ==============
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_PROSPECTOR_MODE_SCANNER=y
# 0=YADS 1=Field 2=Operator 3=Radii (touch is off, so this is the only selector).
CONFIG_PROSPECTOR_DEFAULT_LAYOUT=1

# ============== Backlight ==============
CONFIG_PWM=y
CONFIG_LED=y
CONFIG_LED_PWM=y

# ============== USB: one CDC ACM port, for the bootloader entry ==============
# A display, not an input device: the Prospector Dongle is built to enumerate as
# a CDC ACM serial device only, no HID keyboard (build 2026-09-26: USB_CDC_ACM=y,
# USB_DEVICE_HID unset, one zephyr,cdc-acm-uart node; the host side is not yet
# verified on hardware). The port exists for the 1200 baud bootloader entry:
# opening it at 1200 baud is designed to reboot into the UF2 bootloader
# (PROSPECTOR_BOOTLOADER_ON_1200_BAUD, from
# patches/modules/prospector-zmk-module/), which scripts/flash-prospector.sh
# drives.
# - USB_DEVICE_PRODUCT is a contract with scripts/flash-prospector.sh, which
#   finds the device by this exact string (PRODUCT there). VID/PID stay ZMK's
#   defaults, the same pair as the Imprint Dongle, so the string is what tells
#   the two apart. Change both together.
# - ZMK_USB=n keeps the HID class off (the board defconfig turns it on).
# - BOARD_SERIAL_BACKEND_CDC_ACM=n keeps the xiao_ble board's console set off
#   (Zephyr boards/common/usb/Kconfig.cdc_acm_serial.defconfig: SERIAL /
#   CONSOLE / UART_CONSOLE); with UART_CONSOLE on, LOG_BACKEND_UART defaults on
#   and the module's LOG=y would log to the port. SERIAL=y is then set by hand
#   because USB_CDC_ACM depends on it.
# - config/prospector_scanner.overlay drops the module's second CDC ACM
#   instance, so the device carries one CDC ACM function.
# HWINFO: the module's fault_recovery.c calls hwinfo_get_reset_cause() without
# selecting it. USB_DEVICE_STACK selects it as well; the explicit line keeps a
# USB-less build linking. --logging builds add the console and the log backend
# on the same port.
CONFIG_ZMK_USB=n
CONFIG_USB_DEVICE_STACK=y
CONFIG_BOARD_SERIAL_BACKEND_CDC_ACM=n
CONFIG_SERIAL=y
CONFIG_USB_CDC_ACM=y
CONFIG_USB_DEVICE_PRODUCT="Prospector Dongle"
CONFIG_PROSPECTOR_BOOTLOADER_ON_1200_BAUD=y
CONFIG_HWINFO=y

# ============== Off ==============
CONFIG_ZMK_SPLIT=n
# ZMK_BLE cannot be turned off: scanner mode never calls bt_enable() itself and
# relies on ZMK's ble.c for it, so the connectable "Prospector" advertisement
# stays until the custom shield (t-5gxp) owns the BT bring-up.
CONFIG_ZMK_STUDIO=n
CONFIG_PM_DEVICE=n
CONFIG_I2C=y
# The Cyboard module's imprint shield defaults ZMK_RGB_UNDERGLOW=y module-wide
# (outside its SHIELD_ guard), so every build in this manifest inherits it and
# rgb_underglow.c then #errors without a zmk,underglow chosen node.
CONFIG_ZMK_RGB_UNDERGLOW=n

# ============== Hardware: beekeeb pre-soldered unit ==============
# No APDS9960 on this unit, so brightness is fixed. The touch panel is present
# but unwired: keep TOUCH_ENABLED=n (non-touch build).
CONFIG_PROSPECTOR_TOUCH_ENABLED=n
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=80
