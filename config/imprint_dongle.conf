CONFIG_ZMK_RGB_UNDERGLOW=n

# bond/settings 永続化(NVS)を有効にする。
# 既定だと CONFIG_SETTINGS_NONE=y で BLE bond が保存されず、再接続時に
# 暗号鍵不一致で security failed (err 2) になる。
CONFIG_SETTINGS_NONE=n
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
# MPU 有効ボード(xiao_ble) で flash 書き込みを許可。
# これが無いと NVS 書き込みが silent fail し、bond/identity が保存されず
# 再接続時に security failed (err 2) で繋がらなくなる。
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# 左右両 peripheral と bond を保持する(default 1 だと片方が上書きされる)
CONFIG_BT_MAX_PAIRED=2
