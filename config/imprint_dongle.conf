CONFIG_ZMK_RGB_UNDERGLOW=n

# bond/settings 永続化(NVS)を有効にする。
# 既定だと CONFIG_SETTINGS_NONE=y で BLE bond が保存されず、再接続時に
# 暗号鍵不一致で security failed (err 2) になる。
CONFIG_SETTINGS_NONE=n
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
# MPU 有効ボード(xiao_ble) で flash 書き込みを許可。
# これが無いと NVS 書き込みが silent fail し、bond/identity が保存されず
# 再接続時に security failed (err 2) で繋がらなくなる。
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# 左右両 peripheral と bond を保持する(default 1 だと片方が上書きされる)
CONFIG_BT_MAX_PAIRED=2

# Phase 5a: 右半分のトラックボールを dongle 経由で HID へ転送
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_SPLIT=y

# USB HID descriptor で bCountryCode=33(US/ANSI) を自己申告する。
# 未申告(0)だと macOS がキーボード種別(ANSI/ISO/JIS)を推測・Keyboard Setup
# Assistant に頼り、per-machine の隠れ状態で ISO 誤判定 → ` が § になる。
# Kconfig は patches/zephyr/usb-hid-country-code.patch が追加する。
CONFIG_USB_HID_COUNTRY_CODE=33

# 半体（左右）の残量を dongle が BAS で購読し、vendor HID report 0x21
# {source, level} として macOS ホストへ送る（消費者 = host bridge chord）。
# FETCHING=y = 半体との Battery Level 購読（discovery 時 1 回の read + 以後 notify。
#              定期 read は無く、半体側に新しい wake 源は増えない）。
# _HID=y     = 0x21 の送出経路（USB のみ。BLE HOG は vkey と同じく descope）。
# 後者の Kconfig は patches/zmk/vkey-report.patch が追加する。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_HID=y

# Prospector Dongle feed: broadcast layer / peripheral batteries / modifiers as
# BLE status advertisement (t-ogura prospector-zmk-module; scan response
# piggyback while ZMK advertises, own non-connectable ADV otherwise). Central
# builds only; peripherals compile it out. KEYBOARD_NAME stays unset on purpose:
# a non-empty value makes the module bt_set_name() the dongle at boot, while
# empty falls back to CONFIG_BT_DEVICE_NAME ("Imprint Dongle"). USB product
# string (the chord contract) is untouched either way. CENTRAL_SIDE="AUX" =
# the central is neither half; EXPECTED_PERIPHERAL_COUNT=2 = both halves must
# be up before the module stops its burst/silent connect-friendly cycle.
CONFIG_ZMK_STATUS_ADVERTISEMENT=y
CONFIG_ZMK_STATUS_ADV_CENTRAL_SIDE="AUX"
CONFIG_PROSPECTOR_EXPECTED_PERIPHERAL_COUNT=2
# Workaround for a prospector-zmk-module v2.2.3 bug on ZMK main: the module picks
# its piggyback data layout with `#if defined(BT_LE_ADV_OPT_FORCE_NAME_IN_AD)`,
# but ZMK's Zephyr fork declares that option as an enum constant (invisible to
# the preprocessor), so the module falls into its "name goes to SD" layout and
# puts the 28-byte manufacturer data into the AD. ZMK's own adv params force the
# name into the AD, so the update fails every cycle with "Too big advertising
# data" (-EINVAL, measured 2026-09-25 on the -logging build) and nothing is ever
# broadcast. Defining the name as a self-referential macro makes the check true
# while every use still resolves to the enum. Drop this once the module detects
# the layout without the preprocessor (upstream report tracked in t-tbaf).
CONFIG_COMPILER_OPT="-DBT_LE_ADV_OPT_FORCE_NAME_IN_AD=BT_LE_ADV_OPT_FORCE_NAME_IN_AD"
