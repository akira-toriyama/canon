# 左右両 peripheral と bond を保持する(default 1 だと片方が上書きされる)
CONFIG_BT_MAX_PAIRED=2

# USB HID descriptor で bCountryCode=33(US/ANSI) を自己申告する。
# 未申告(0)だと macOS がキーボード種別(ANSI/ISO/JIS)を推測・Keyboard Setup
# Assistant に頼り、per-machine の隠れ状態で ISO 誤判定 → ` が § になる。
# Kconfig は patches/zephyr/usb-hid-country-code.patch が追加する。
CONFIG_USB_HID_COUNTRY_CODE=33

# 半体（左右）の残量を dongle が BAS で購読し、vendor HID report 0x21
# {source, level} として macOS ホストへ送る（消費者 = host bridge chord）。
# FETCHING=y = 半体との Battery Level 購読（discovery 時 1 回の read + 以後 notify。
#              定期 read は無く、半体側に新しい wake 源は増えない）。
# _HID=y     = 0x21 の送出経路（USB のみ。BLE HOG は vkey と同じく descope）。
# 後者の Kconfig は patches/zmk/vkey-report.patch が追加する。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_HID=y

# Prospector Dongle feed (zmk-beacon src/status_broadcaster.c): both halves'
# battery, the highest active layer and a count of key presses (the Prospector
# Dongle's sprite steps one frame per press, t-7c05) go out as BLE manufacturer
# data on a second, legacy, non-connectable advertising set next to ZMK's own,
# every 200 ms and right after a key press. Central builds only; peripherals
# compile it out. The option selects
# CONFIG_BT_EXT_ADV, under which the host serves ZMK's legacy advertising from
# the same pool of sets, so the pool must hold 2 (the module's BUILD_ASSERT
# fails the build otherwise). BT_EXT_ADV costs about 34 KB flash / 11 KB RAM
# and moves the host to the extended HCI commands; hardware 2026-09-27 (t-eray
# spike): reconnects unchanged in 5 reboots and a half power cycle, 0
# advertising errors. Until 2026-09-27 this feed came from t-ogura's
# prospector-zmk-module riding ZMK's scan response (t-k8pk).
CONFIG_BEACON_STATUS_BROADCAST=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

# Bootloader entry on a 1200 baud touch of the dongle's CDC ACM port (zmk-beacon
# src/bootloader_on_1200_baud.c, the Prospector Dongle's mechanism; user
# decision 2026-09-27): a flash needs no reset double-tap, so the keyboard is
# down only while the image is written. Any program that sets that port to
# 1200 baud reboots the dongle into its bootloader; on this Mac only the flash
# procedure in CLAUDE.md does, and it must not run while flash-watch.sh /
# flash-reset.sh do.
CONFIG_BEACON_BOOTLOADER_ON_1200_BAUD=y
