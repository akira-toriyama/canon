CONFIG_ZMK_RGB_UNDERGLOW=n

# bond/settings 永続化(NVS)を有効にする。
# 既定だと CONFIG_SETTINGS_NONE=y で BLE bond が保存されず、再接続時に
# 暗号鍵不一致で security failed (err 2) になる。
CONFIG_SETTINGS_NONE=n
CONFIG_NVS=y
CONFIG_SETTINGS_NVS=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_FLASH_PAGE_LAYOUT=y
# MPU 有効ボード(xiao_ble) で flash 書き込みを許可。
# これが無いと NVS 書き込みが silent fail し、bond/identity が保存されず
# 再接続時に security failed (err 2) で繋がらなくなる。
CONFIG_MPU_ALLOW_FLASH_WRITE=y

# 左右両 peripheral と bond を保持する(default 1 だと片方が上書きされる)
CONFIG_BT_MAX_PAIRED=2

# Phase 5a: 右半分のトラックボールを dongle 経由で HID へ転送
CONFIG_ZMK_POINTING=y
CONFIG_ZMK_INPUT_SPLIT=y

# USB HID descriptor で bCountryCode=33(US/ANSI) を自己申告する。
# 未申告(0)だと macOS がキーボード種別(ANSI/ISO/JIS)を推測・Keyboard Setup
# Assistant に頼り、per-machine の隠れ状態で ISO 誤判定 → ` が § になる。
# Kconfig は patches/zephyr/usb-hid-country-code.patch が追加する。
CONFIG_USB_HID_COUNTRY_CODE=33

# 半体（左右）の残量を dongle が BAS で購読し、vendor HID report 0x21
# {source, level} として macOS ホストへ送る（消費者 = host bridge chord）。
# FETCHING=y = 半体との Battery Level 購読（discovery 時 1 回の read + 以後 notify。
#              定期 read は無く、半体側に新しい wake 源は増えない）。
# _HID=y     = 0x21 の送出経路（USB のみ。BLE HOG は vkey と同じく descope）。
# 後者の Kconfig は patches/zmk/vkey-report.patch が追加する。
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_HID=y
