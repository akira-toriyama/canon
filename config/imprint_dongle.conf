# imprint.conf applies here too (ZMK reads the conf of each prefix of the
# shield name), so underglow is off without a line here.

# Two bonds, both taken by the halves: a split central's BLE host profiles
# are BT_MAX_PAIRED - ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS (zmk
# app/include/zmk/ble.h), so the dongle keeps none; its host is on USB. ZMK's
# own default for a split central is 6. With no profile, ble.c indexes its
# zero-length profiles[] unchecked, which the build reports as -Wdiv-by-zero
# and -Warray-bounds in ble.c (projects t-n7gy).
CONFIG_BT_MAX_PAIRED=2

# bCountryCode 33 (US) in the USB HID descriptor; the option comes from
# patches/zephyr/usb-hid-country-code.patch. macOS keeps a keyboard type
# (ANSI/ISO/JIS) per <productID>-<vendorID>-<countryCode>, so 33 moves the
# dongle off the code-0 record it would share with other ZMK devices on the
# same VID/PID, where an ISO answer turns ` into §, onto the code-33 record,
# which it shares only with devices that also report 33 (zmk-hid-host's
# receivers). macOS never interprets the value: a Mac new to all of them
# still runs the Keyboard Setup Assistant once.
CONFIG_USB_HID_COUNTRY_CODE=33

# The halves' battery levels go to the USB host as vendor HID report 0x21
# {source, level}, which the host bridge chord reads. FETCHING subscribes to
# each half's Battery Level (one read at discovery, then notifications; no
# periodic read, so the halves gain no wake source). HID is the 0x21 path,
# USB only, added by patches/zmk/vkey-report.patch.
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_HID=y

# The status advertisement the Prospector Dongle reads (zmk-beacon; what it
# carries and when: the Kconfig help of BEACON_STATUS_BROADCAST and
# src/status_payload.h). It is a second advertising set next to ZMK's own,
# and the option selects BT_EXT_ADV, under which the host serves ZMK's legacy
# advertising from the same pool of sets: the pool must hold 2, or the
# module's BUILD_ASSERT fails the build.
CONFIG_BEACON_STATUS_BROADCAST=y
CONFIG_BT_EXT_ADV_MAX_ADV_SET=2

# Bootloader entry on a 1200 baud touch of the dongle's CDC ACM port
# (zmk-beacon src/bootloader_on_1200_baud.c): a flash needs no reset
# double-tap, so the keyboard is down only while the image is written. Any
# program that sets that port to 1200 baud reboots the dongle into its
# bootloader; on this Mac only scripts/flash-dongle.sh does, and it
# must not run while flash-watch.sh / flash-reset.sh do.
CONFIG_BEACON_BOOTLOADER_ON_1200_BAUD=y
