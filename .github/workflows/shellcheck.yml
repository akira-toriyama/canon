name: ShellCheck

# Lints every tracked shell script with the shellcheck the Ubuntu runner ships.
on:
  # push only on main: a PR branch is checked once, through pull_request.
  push:
    branches: [main]
    paths:
      - "**/*.sh"
      - "**/*.bash"
      - ".github/workflows/shellcheck.yml"
  pull_request:
    paths:
      - "**/*.sh"
      - "**/*.bash"
      - ".github/workflows/shellcheck.yml"
  workflow_dispatch:

# Explicit, or the fleet zizmor gate fails on the default token permissions
# (excessive-permissions).
permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Lint-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false
      - name: Run shellcheck
        run: |
          set -euo pipefail
          files=$(git ls-files '*.sh' '*.bash')
          echo "Checking:"; echo "$files"
          # Each file's shell comes from its shebang. The newline-separated
          # list is word-split on purpose: a script name with a space breaks it.
          # shellcheck disable=SC2086
          shellcheck $files
