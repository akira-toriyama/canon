name: Verify vkey aliases sync

# config/imprint.keymap's &vkey <id> is the single source: the generated
# config/vkey-aliases.toml (pasted into chord's [v-key-aliases]) must equal
# what scripts/gen-vkey-aliases.py generates from it, and every id must decode.
on:
  # push only on main: a PR branch is checked once, through pull_request.
  push:
    branches: [main]
    paths:
      - config/imprint.keymap
      - config/vkey-aliases.toml
      - scripts/gen-vkey-aliases.py
      - .github/workflows/verify-vkey-sync.yml
  pull_request:
    paths:
      - config/imprint.keymap
      - config/vkey-aliases.toml
      - scripts/gen-vkey-aliases.py
      - .github/workflows/verify-vkey-sync.yml
  workflow_dispatch:

# Least privilege, made explicit — closes zizmor's excessive-permissions
# finding ahead of the fleet-wide zizmor gate (akira-toriyama/.github t-qbp1).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Verify-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false
      # The runner's python3 (stdlib only; the script needs 3.8+).
      - name: Check vkey aliases are in sync
        run: python3 scripts/gen-vkey-aliases.py --check
