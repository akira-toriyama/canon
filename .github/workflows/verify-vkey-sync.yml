name: Verify vkey aliases sync

# config/imprint.keymap + config/ble_hid_host_receiver.keymap の &vkey <id> を
# 単一ソースとし、生成物 config/vkey-aliases.toml（chord の [v-key-aliases] へ
# 貼る用）がそこから生成された状態と一致するか、id が全て正しく復号でき衝突が
# 無いかを検証する。キーマップ↔alias の id 二重管理を排除する（eiji パターンと同型）。
on:
  push:
    paths:
      - config/imprint.keymap
      - config/ble_hid_host_receiver.keymap
      - config/vkey-aliases.toml
      - scripts/gen-vkey-aliases.py
      - .github/workflows/verify-vkey-sync.yml
  pull_request:
    paths:
      - config/imprint.keymap
      - config/ble_hid_host_receiver.keymap
      - config/vkey-aliases.toml
      - scripts/gen-vkey-aliases.py
  workflow_dispatch:

# Least privilege, made explicit — closes zizmor's excessive-permissions
# finding ahead of the fleet-wide zizmor gate (akira-toriyama/.github t-qbp1).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check vkey aliases are in sync
        run: python3 scripts/gen-vkey-aliases.py --check
