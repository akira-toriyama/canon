name: Assign PR

# Assign every opened PR to the maintainer (akira-toriyama). Runs that
# Dependabot triggers are skipped (the if: below), so its PRs stay unassigned:
# the fleet-managed .github/dependabot.yml sets no assignees.
on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Assign maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-assignee akira-toriyama
