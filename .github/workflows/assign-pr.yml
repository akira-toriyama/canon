name: Assign PR

# A PR Dependabot opens stays unassigned unless someone else reopens it: the
# job skips Dependabot's runs, and the fleet-managed .github/dependabot.yml
# (never edited here) sets no assignees.
on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Assign maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-assignee akira-toriyama
