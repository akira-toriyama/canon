name: Assign PR

# Assign PRs to the maintainer (akira-toriyama) when they are opened or
# reopened. Runs Dependabot started are skipped (the if: below), and the
# fleet-managed .github/dependabot.yml sets no assignees, so a PR Dependabot
# opens stays unassigned unless someone else reopens it.
on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Assign maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-assignee akira-toriyama
