name: Assign PR

# Assign every opened or reopened PR to the maintainer (akira-toriyama). The
# job is skipped when Dependabot started the run (the if: below), so a PR
# Dependabot opens gets no assignee unless someone else reopens it: the
# fleet-managed .github/dependabot.yml sets no assignees.
on:
  pull_request:
    types: [opened, reopened]

permissions:
  pull-requests: write

jobs:
  assign:
    if: github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Assign maintainer
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-assignee akira-toriyama
