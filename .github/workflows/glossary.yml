name: Deploy glossary site

# Builds a single-page site from docs/glossary.md and publishes it at
# https://akira-toriyama.github.io/canon/. The builder and the viewer live in
# akira-toriyama/glossary-site's reusable workflow, which deploys on every
# event but pull_request: a PR run only builds (the site is its run artifact).

on:
  push:
    branches: [main]
    paths:
      - docs/glossary.md
      - .github/workflows/glossary.yml
  pull_request:
    paths:
      - docs/glossary.md
      - .github/workflows/glossary.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PRs and main in separate groups: a PR build never queues with a main deploy
  group: pages-${{ github.event.number || github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    uses: akira-toriyama/glossary-site/.github/workflows/deploy.yml@main
