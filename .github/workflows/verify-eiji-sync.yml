name: Verify eiji map sync

# config/eiji_macros.dtsi is the single source: the en_* block of
# keymap_drawer.config.yaml must equal what scripts/gen-eiji-drawer-map.py
# generates from it.
on:
  # push only on main: a PR branch is checked once, through pull_request.
  push:
    branches: [main]
    paths:
      - config/eiji_macros.dtsi
      - keymap_drawer.config.yaml
      - scripts/gen-eiji-drawer-map.py
      - .github/workflows/verify-eiji-sync.yml
  pull_request:
    paths:
      - config/eiji_macros.dtsi
      - keymap_drawer.config.yaml
      - scripts/gen-eiji-drawer-map.py
      - .github/workflows/verify-eiji-sync.yml
  workflow_dispatch:

# Least privilege, made explicit — closes zizmor's excessive-permissions
# finding ahead of the fleet-wide zizmor gate (akira-toriyama/.github t-qbp1).
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Verify-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false
      # The runner's python3 (stdlib only; the script needs 3.8+).
      - name: Check eiji_* mapping is in sync
        run: python3 scripts/gen-eiji-drawer-map.py --check
