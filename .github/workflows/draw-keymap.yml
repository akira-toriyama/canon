name: Draw keymap

on:
  push:
    paths:
      - config/*.keymap
      - config/*.dtsi
      - config/*.h
      - config/imprint.json
      - keymap_drawer.config.yaml
      - .github/workflows/draw-keymap.yml
  workflow_dispatch:

jobs:
  draw:
    permissions:
      contents: write
    # Pinned by commit with its tag as a comment; Dependabot (github-actions) bumps it.
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@a44809b8cc718cbff646641f49a8f71a9368336d # v0.23.0
    with:
      # imprint only (canon's one keymap), named rather than the default
      # config/*.keymap, so that a keymap without a physical layout cannot fail
      # the run with "physical layout could not be found".
      keymap_patterns: config/imprint.keymap
      commit_message: ":bento:(keymap-drawer)= update the generated svg"
      amend_commit: false
      # A keymap that fails to parse or draw fails the run (a broken keymap shows early).
      fail_on_error: true
