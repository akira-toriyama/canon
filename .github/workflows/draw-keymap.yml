name: Draw keymap

on:
  push:
    paths:
      - config/*.keymap
      - config/*.dtsi
      - config/*.h
      - config/imprint.json
      - keymap_drawer.config.yaml
      - .github/workflows/draw-keymap.yml
  workflow_dispatch:

jobs:
  draw:
    permissions:
      contents: write
    # タグ固定（Dependabot github-actions が更新を追従）。
    uses: caksoylar/keymap-drawer/.github/workflows/draw-zmk.yml@a44809b8cc718cbff646641f49a8f71a9368336d # v0.23.0
    with:
      # 描画対象は imprint のみ（canon の唯一の製品）。既定の config/*.keymap では
      # なく明示指定にして、物理レイアウトを持たない keymap が混ざったときの
      # "physical layout could not be found" 事故を避ける。
      keymap_patterns: config/imprint.keymap
      commit_message: ":bento: ci(keymap-drawer): SVG を更新"
      amend_commit: false
      # keymap のパース/描画でエラーが出たら CI を落とす（壊れた keymap の早期検知）。
      fail_on_error: true
