name: ZMK Build

# The firmware build that build.yml and release.yml call. Its steps are
# scripts/zmk-west.sh, the same steps scripts/build-zmk.sh runs locally.
#
# Kept local instead of calling ZMK's
# zmkfirmware/zmk/.github/workflows/build-user-config.yml:
# - canon builds ZMK and Zephyr with patches/<tree>/*.patch applied; ZMK's
#   workflow applies none, and the imprint keymap's &vkey, a patched-in
#   behavior, does not resolve there.
# - the fleet's zizmor policy (.github/zizmor.yml) hash-pins every third-party
#   `uses:`, so ZMK's workflow could be called at a commit SHA only, never at
#   @main.

on:
  workflow_call:

jobs:
  # build.yaml is the only list of targets: the matrix comes from it here and
  # in build-zmk.sh, through the same `zmk-west.sh pairs`.
  matrix:
    runs-on: ubuntu-latest
    outputs:
      include: ${{ steps.gen.outputs.include }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Reads build.yaml only, never pushes — drop the checkout token. t-yaxa
          persist-credentials: false
      - id: gen
        name: Derive build matrix from build.yaml
        run: |
          set -euo pipefail
          include=$(scripts/zmk-west.sh pairs | jq -R -s -c 'split("\n") | map(select(length > 0) | split("\t") | {board: .[0], shield: .[1]})')
          echo "include=$include" >> "$GITHUB_OUTPUT"
          echo "matrix: $include"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    # The image ZMK's own workflow builds in, and build-zmk.sh's default
    # (ZMK_IMAGE): change both together.
    container:
      image: zmkfirmware/zmk-build-arm:stable
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.matrix.outputs.include) }}
    # The main ruleset requires every target's check as
    # `build / Build (<board>, <shield>)`: the caller's job id and this name.
    # Keep both.
    name: Build (${{ matrix.board }}, ${{ matrix.shield }})
    defaults:
      run:
        shell: bash
    env:
      BOARD: ${{ matrix.board }}
      SHIELD: ${{ matrix.shield }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Build-only, never pushes — drop the persisted checkout token. t-yaxa
          persist-credentials: false

      # Treeless: commits only, trees and blobs come with the checkout (what
      # ZMK's own workflow fetches).
      - name: West init + update (ZMK @ main)
        run: scripts/zmk-west.sh update --fetch-opt=--filter=tree:0

      - name: Apply out-of-tree patches (zmk, zephyr)
        run: scripts/zmk-west.sh patch

      - name: Build firmware
        run: |
          set -euo pipefail
          scripts/zmk-west.sh build "$BOARD" "$SHIELD" ""
          cp "build/$SHIELD/zephyr/zmk.uf2" "$SHIELD.uf2"

      # One artifact per shield, named after it: release.yml collects
      # dist/<shield>/<shield>.uf2.
      - name: Upload firmware artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.shield }}
          path: ${{ matrix.shield }}.uf2
