name: Commit lint

# Thin caller — コミットメッセージ検証を共有 reusable workflow へ委譲する。
# ロジックは akira-toriyama/.github/.github/workflows/commit-lint.yml に集約
# （chord ほか family リポジトリと単一ソース）。規約: docs/commit-convention.md
# ／ ローカルは scripts/hooks/commit-msg。
# 注: 失敗時の CI メッセージは共有 reusable の文言（英語）になる。許容済。
on:
  pull_request:

jobs:
  lint:
    uses: akira-toriyama/.github/.github/workflows/commit-lint.yml@main
