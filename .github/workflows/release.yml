name: Release

# On every push to main, glyph walks main since the last v* tag squash-safe
# (each merge expanded to its PR's commits), computes the next version and the
# notes in one walk, and upserts one rolling DRAFT release; no tag is created
# (GitHub creates it when the draft is published). A draft for the same
# version is updated in place and glyph deletes an automatic draft for another
# version, so there is at most one. Publishing is manual, after a look at the
# draft in the GitHub UI. workflow_dispatch with dry_run=true computes the
# version and notes and builds, without writing a draft or using up a version.
# Convention: https://github.com/akira-toriyama/.github/blob/main/CONTRIBUTING.md
#
# The firmware comes from the same reusable build as CI
# (.github/workflows/zmk-build.yml): a second build definition here drifted
# from it once and broke only the release.
# Jobs: version (verdict + draft upsert) -> build (reusable) -> draft (assets).
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: build and write the notes, but no draft release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# Least privilege: `version` (glyph upserts the draft release) and `draft`
# (asset upload) write releases (contents: write); `build` (firmware) needs
# read only. Scoped per-job below ahead of the fleet zizmor gate
# (akira-toriyama/.github t-qbp1).
permissions:
  contents: read

jobs:
  # Next version + notes + rolling draft upsert (glyph release). build and
  # draft run only when this job outputs release == true.
  version:
    runs-on: ubuntu-latest
    # glyph release upserts the draft (a dry run writes nothing).
    permissions:
      contents: write
    outputs:
      release: ${{ steps.verdict.outputs.release }}
      version: ${{ steps.verdict.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # glyph reads the tags and the walk range from the local git: full history.
          fetch-depth: 0
          # Every write goes through glyph/gh with GH_TOKEN, never git push —
          # keep the checkout token out of .git/config (zizmor artipacked). t-yaxa
          persist-credentials: false

      # glyph comes from its own composite install (checksum + provenance
      # verified). The action pin and the binary version stay on the same tag.
      - uses: akira-toriyama/glyph/.github/actions/install@v4.3.0
        with:
          version: v4.3.0
          token: ${{ github.token }}

      # One walk yields both the version and the notes (separate bump and
      # notes calls would walk twice, and a merge landing in between could
      # split them). Unless this is a dry run, the same call upserts the
      # rolling draft. Exit 1 is the uniform soft no-release (nothing to
      # release), folded into a successful no-op; on a none verdict glyph also
      # deletes a leftover draft.
      - name: Compose the verdict and upsert the rolling DRAFT
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(release --json)
          if [ "$DRY_RUN" = "true" ]; then
            args=(release --dry-run --json)
          fi
          status=0
          glyph "${args[@]}" > "$RUNNER_TEMP/verdict.json" 2> "$RUNNER_TEMP/verdict.err" || status=$?
          cat "$RUNNER_TEMP/verdict.err" >&2
          if [ "$status" -eq 1 ]; then
            reason="$(jq -r '.reason // empty' "$RUNNER_TEMP/verdict.json" 2>/dev/null || true)"
            echo "::notice::${reason:-Nothing to release: no change since the last release moves the version.}"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          tag="$(jq -r .tag "$RUNNER_TEMP/verdict.json")"
          jq -r .body "$RUNNER_TEMP/verdict.json" > RELEASE_NOTES.md
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "verdict: $tag (draft $(jq -r .action "$RUNNER_TEMP/verdict.json"))"

      # The notes as an artifact, for the dry-run preview and the draft job's
      # summary (glyph writes the draft body itself).
      - name: Upload release notes
        if: steps.verdict.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # The reusable build derives its matrix from build.yaml, applies the
  # patches, builds every target and uploads one <shield> artifact each; the
  # draft job downloads them.
  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/zmk-build.yml

  draft:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    # This job only touches release ASSETS: upload the firmware, prune
    # anything outside the allowlist. The draft itself (create/update/stale
    # deletion/target) is glyph's, done in the `version` job.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job, and gh finds the repository from a git
      # remote otherwise ("not a git repository").
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      # The only files a release may carry: canon is public, so a target that
      # joins build.yaml reaches a release only once it is listed here. The
      # imprint's three images and the Prospector Dongle's companion image
      # share one manifest, one patch set and one draft (t-tbaf, 2026-09-25).
      ASSETS: imprint_left.uf2 imprint_right.uf2 imprint_dongle.uf2 prospector.uf2
    steps:
      # Every artifact of build and version, as dist/<artifact>/<file>.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect firmware + notes
        run: |
          set -euo pipefail
          read -ra assets <<<"$ASSETS"
          mkdir -p out
          for a in "${assets[@]}"; do
            cp "dist/${a%.uf2}/$a" "out/$a"
          done
          # An image outside the list means build.yaml changed without it: stop.
          while IFS= read -r f; do
            case " $ASSETS " in
              *" ${f##*/} "*) ;;
              *)
                echo "::error::${f#dist/} is not in the release asset list (ASSETS); nothing was attached"
                exit 1
                ;;
            esac
          done < <(find dist -name '*.uf2')
          cp dist/release-notes/RELEASE_NOTES.md out/RELEASE_NOTES.md
          echo "Collected:"; ls -l out

      # dry_run (workflow_dispatch only): one preview artifact with the images
      # and the notes instead of a draft, so no version is used up.
      - name: Upload preview (dry run)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-preview-${{ needs.version.outputs.version }}
          path: out/

      - name: Dry-run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          {
            echo "## Dry run: ${VERSION} (no draft written)"
            echo
            echo '```'
            cat out/RELEASE_NOTES.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A normal run (push to main, or a dispatch without dry_run): attach the
      # images to the draft the version job upserted and prune every other
      # asset. A published release is never touched.
      - name: Attach firmware to the rolling DRAFT
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          read -ra assets <<<"$ASSETS"
          gh release upload "$VERSION" "${assets[@]/#/out/}" --clobber
          # --clobber replaces assets of the same name but keeps the others
          # (an old image of a target no longer listed), which publishing the
          # draft would make public: delete them every time.
          while IFS= read -r a; do
            [ -z "$a" ] && continue
            case " $ASSETS " in *" $a "*) continue ;; esac
            echo "::notice::Deleting $a from draft $VERSION: not in the release asset list"
            gh release delete-asset "$VERSION" "$a" --yes
          done < <(gh release view "$VERSION" --json assets --jq '.assets[].name')

          url="$(gh release view "$VERSION" --json url --jq .url)"
          echo "::notice::Firmware attached to draft release ${VERSION} (not published, no tag yet). Review it, then publish by hand: ${url}"
          {
            echo "## Firmware attached to draft release ${VERSION} (not published)"
            echo
            echo "The draft grows with every merge to main."
            echo "Review it, then publish by hand (that creates the tag): ${url}"
          } >> "$GITHUB_STEP_SUMMARY"
