name: Release

# main へ push（PR マージ）されると、glyph が最後の v* タグ以降の main を
# squash-safe に歩き（各マージポイントを PR に展開して pre-squash commit を
# 分類）、次版とリリースノートを 1 回の walk で算出して「ローリングドラフト」
# GitHub Release を upsert する。タグは作らない（GitHub がドラフト Publish 時に
# 生成）。同一次版のドラフトは内容・target を上書き更新し、別版の自動ドラフトは
# glyph が破棄して常に 1 本に保つ。よって main にマージするほど「次リリース
# 下書き」が育ち、未公開のうちはタグ・版が増殖しない。公開は手動
# （GitHub UI で内容確認のうえ Publish。publish 時に初めてタグ生成）。
# workflow_dispatch + dry_run=true は版算出+ノート+ビルドのみ＝ドラフトを
# 作らず版も消費しない完全プレビュー。規約: https://github.com/akira-toriyama/.github/blob/main/CONTRIBUTING.md
#
# firmware ビルドは通常 CI と同じ reusable (.github/workflows/zmk-build.yml) に
# 一本化している。以前は release.yml が独自に west+patch+build を持っていたが、
# build.yml 側と重複して drift し（dongle の board 名 xiao_ble/nrf52840/zmk が
# slash を含むための SHIELD 解析破綻 + canon ローカル shield の BOARD_ROOT 欠落）
# release だけ壊れた。ビルド定義を 1 つに集約してこの種の drift を構造的に防ぐ。
# job 構成: version（verdict + draft upsert）→ build（reusable）→ draft（成果物添付）。
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "プレビューのみ（ドラフトを作らず artifact だけ）"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# Least privilege: `version` (glyph upserts the draft release) and `draft`
# (asset upload) write releases (contents: write); `build` (firmware) needs
# read only. Scoped per-job below ahead of the fleet zizmor gate
# (akira-toriyama/.github t-qbp1).
permissions:
  contents: read

jobs:
  # 次版算出 + リリースノート + ローリングドラフト upsert（glyph release）。
  # firmware ビルド (build) と成果物添付 (draft) はこの出力 release==true の
  # ときだけ走る。
  version:
    runs-on: ubuntu-latest
    # glyph release がドラフトを upsert する（dry run では書かない）。
    permissions:
      contents: write
    outputs:
      release: ${{ steps.verdict.outputs.release }}
      version: ${{ steps.verdict.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # glyph はタグと walk range をローカル git から読むので全履歴が要る。
          fetch-depth: 0
          # 書き込みは全て glyph/gh + GH_TOKEN 経由で git push はしない —
          # checkout token を .git/config に残さない (zizmor artipacked)。t-yaxa
          persist-credentials: false

      # glyph 本体は自前の composite install（checksum + provenance 検証つき）
      # で導入。action の pin と binary の version は同じ tag に揃える。
      - uses: akira-toriyama/glyph/.github/actions/install@v3.0.0
        with:
          version: v3.0.0
          token: ${{ github.token }}

      # 1 回の walk で次版と notes を一緒に出す（bump / notes を別々に呼ぶと
      # walk が 2 回になり、間にマージが着地すると版と notes がズレうる）。
      # dry run でなければ同じ呼び出しがローリングドラフトを upsert する。
      # exit 1 は一様な soft no-release（リリース対象なし）— 成功の no-op に
      # 畳む。none verdict では glyph が残存ドラフトも削除して収束させる。
      - name: Compose the verdict and upsert the rolling DRAFT
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(release --json)
          if [ "$DRY_RUN" = "true" ]; then
            args=(release --dry-run --json)
          fi
          status=0
          glyph "${args[@]}" > "$RUNNER_TEMP/verdict.json" 2> "$RUNNER_TEMP/verdict.err" || status=$?
          cat "$RUNNER_TEMP/verdict.err" >&2
          if [ "$status" -eq 1 ]; then
            reason="$(jq -r '.reason // empty' "$RUNNER_TEMP/verdict.json" 2>/dev/null || true)"
            echo "::notice::${reason:-リリース対象の変更が無いため何もしません。}"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          tag="$(jq -r .tag "$RUNNER_TEMP/verdict.json")"
          jq -r .body "$RUNNER_TEMP/verdict.json" > RELEASE_NOTES.md
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "verdict: $tag (draft $(jq -r .action "$RUNNER_TEMP/verdict.json"))"

      # dry run のプレビューと draft job の summary 用に notes を artifact 化
      # （ドラフト本文そのものは glyph が直接書いている）。
      - name: Upload release notes
        if: steps.verdict.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  # firmware ビルドは通常 CI と同一の reusable に委譲（重複/drift 解消）。
  # zmk-build.yml が build.yaml を唯一のソースに matrix を生成し、patch を
  # 適用して全ターゲット (imprint_left/right/dongle) を build し
  # <shield> 名の artifact を上げる。draft job がそれを DL してリリースへ添付する。
  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/zmk-build.yml

  draft:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    # This job only touches release ASSETS: upload the firmware, prune
    # anything outside the allowlist. The draft itself (create/update/stale
    # deletion/target) is glyph's, done in the `version` job.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # この job は checkout しない（成果物 DL のみ）。gh は通常 git remote から
      # repo を特定するが .git が無いと "not a git repository" で落ちるため、
      # GH_REPO で明示する（gh release / gh api 全コマンドがこれで動く）。
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      # build (reusable) と version が上げた artifact を全部回収。
      # download-artifact は <path>/<artifact名>/<file> 構造で展開する。
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect firmware + notes
        run: |
          set -euo pipefail
          mkdir -p out
          # canon は PUBLIC repo。リリース資産は imprint の 3 ターゲットだけを
          # 明示 allowlist で集める（glob 禁止＝将来 build.yaml に非 imprint の
          # ターゲットが混ざっても公開資産へ漏れない）。
          for f in imprint_left imprint_right imprint_dongle; do
            cp "dist/$f/$f.uf2" "out/$f.uf2"
          done
          # allowlist 外の uf2 が来ていたら（＝build.yaml 変更の取りこぼし）中止。
          if [ -n "$(find dist -name '*.uf2' \
                       ! -name 'imprint_left.uf2' \
                       ! -name 'imprint_right.uf2' \
                       ! -name 'imprint_dongle.uf2' -print -quit)" ]; then
            echo "::error::allowlist 外の uf2 を検出したためリリース添付を中止"
            exit 1
          fi
          cp dist/release-notes/RELEASE_NOTES.md out/RELEASE_NOTES.md
          echo "収集した成果物:"; ls -l out

      # dry_run（workflow_dispatch のみ）: ドラフトを作らず、ビルド成果物と
      # ノートを 1 つの preview artifact にまとめて上げる（版を消費しない＝
      # 完全プレビュー）。
      - name: Upload preview (dry run)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-preview-${{ needs.version.outputs.version }}
          path: |
            out/imprint_left.uf2
            out/imprint_right.uf2
            out/imprint_dongle.uf2
            out/RELEASE_NOTES.md

      - name: Dry-run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          {
            echo "## Dry run: ${VERSION}（ドラフトは未作成）"
            echo
            echo '```'
            cat out/RELEASE_NOTES.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # 通常実行（push:main / 手動 dry_run でない）: version job で glyph が
      # upsert 済みのドラフトへ成果物を添付し、allowlist 外の残存資産を剪定
      # する。公開済み Release には一切触れない。
      - name: Attach firmware to the rolling DRAFT
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          # 資産は明示列挙（glob 禁止）。canon は PUBLIC なので、公開 Release へ
          # 上げてよいのは imprint の 3 ターゲットだけ。
          assets="out/imprint_left.uf2 out/imprint_right.uf2 out/imprint_dongle.uf2"
          # shellcheck disable=SC2086
          gh release upload "$VERSION" $assets --clobber
          # --clobber は同名資産を上書きするだけで、allowlist 外の古い資産
          # （過去ビルドの非 imprint uf2 等）は消さない。ドラフトに残ると
          # Publish した瞬間に公開されるので、毎回明示的に剪定する。
          while IFS= read -r a; do
            [ -z "$a" ] && continue
            echo "::notice::ドラフト $VERSION から allowlist 外の資産 $a を削除"
            gh release delete-asset "$VERSION" "$a" --yes
          done < <(gh release view "$VERSION" --json assets \
            --jq '.assets[].name | select(. != "imprint_left.uf2" and . != "imprint_right.uf2" and . != "imprint_dongle.uf2")')

          url="$(gh release view "$VERSION" --json url --jq .url)"
          echo "::notice::ドラフト Release ${VERSION} へ成果物を添付（未公開・タグ未生成）。内容確認のうえ手動 Publish: ${url}"
          {
            echo "## Draft Release ${VERSION} に成果物を添付（未公開）"
            echo
            echo "main にマージするほどこの下書きが育ちます。"
            echo "内容を確認のうえ手動で Publish（その時点でタグ生成）: ${url}"
          } >> "$GITHUB_STEP_SUMMARY"
