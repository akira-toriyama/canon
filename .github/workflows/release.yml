name: Release

# On every push to main, glyph computes the next version and the notes from the
# commits since the last v* tag (a squash merge read as its PR's commits) and
# upserts the one rolling DRAFT release. No tag is created here: GitHub creates
# it when the draft is published, by hand, after a look at it in the GitHub UI.
# Convention: https://github.com/akira-toriyama/.github/blob/main/CONTRIBUTING.md
#
# The firmware comes from the same reusable build as CI
# (.github/workflows/zmk-build.yml): a second build definition here drifted
# from it once and broke only the release.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Preview only: build and write the notes, but no draft release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

# Read at the workflow level: `build` sets no permissions of its own and
# inherits these, and with such a job beside others the fleet zizmor gate
# fails on a workflow-level write (excessive-permissions). `version` and
# `draft` take contents: write per job.
permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    # glyph release upserts the draft (a dry run writes nothing).
    permissions:
      contents: write
    outputs:
      release: ${{ steps.verdict.outputs.release }}
      version: ${{ steps.verdict.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          # glyph reads the tags and the walk range from the local git: full history.
          fetch-depth: 0
          # Every write goes through glyph/gh with GH_TOKEN, never git push —
          # keep the checkout token out of .git/config (zizmor artipacked). t-yaxa
          persist-credentials: false

      # glyph's own install verifies checksum and build provenance. The action
      # ref and `version` move together (glyph-pin-rewrite bumps both).
      - uses: akira-toriyama/glyph/.github/actions/install@v4.3.0
        with:
          version: v4.3.0
          token: ${{ github.token }}

      # One walk yields both the version and the notes (separate bump and
      # notes calls would walk twice, and a merge landing in between could
      # split them). Exit 1 is the uniform soft no-release (nothing to
      # release), folded into a successful no-op; glyph then also deletes a
      # leftover draft unless glyph.toml sets draft_on_none.
      - name: Compose the verdict and upsert the rolling DRAFT
        id: verdict
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          args=(release --json)
          if [ "$DRY_RUN" = "true" ]; then
            args=(release --dry-run --json)
          fi
          status=0
          glyph "${args[@]}" > "$RUNNER_TEMP/verdict.json" 2> "$RUNNER_TEMP/verdict.err" || status=$?
          cat "$RUNNER_TEMP/verdict.err" >&2
          if [ "$status" -eq 1 ]; then
            reason="$(jq -r '.reason // empty' "$RUNNER_TEMP/verdict.json" 2>/dev/null || true)"
            echo "::notice::${reason:-Nothing to release: no change since the last release moves the version.}"
            echo "release=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$status" -ne 0 ]; then
            exit "$status"
          fi
          tag="$(jq -r .tag "$RUNNER_TEMP/verdict.json")"
          jq -r .body "$RUNNER_TEMP/verdict.json" > RELEASE_NOTES.md
          echo "release=true" >> "$GITHUB_OUTPUT"
          echo "tag=$tag"     >> "$GITHUB_OUTPUT"
          echo "verdict: $tag (draft $(jq -r .action "$RUNNER_TEMP/verdict.json"))"

      # The draft job copies the notes on every run, but only a dry run shows
      # them: glyph writes the draft's body itself.
      - name: Upload release notes
        if: steps.verdict.outputs.release == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: RELEASE_NOTES.md

  build:
    needs: version
    if: needs.version.outputs.release == 'true'
    uses: ./.github/workflows/zmk-build.yml

  draft:
    needs: [version, build]
    if: needs.version.outputs.release == 'true'
    # Release assets only: the draft itself (create, update, stale deletion,
    # target) is glyph's, in the version job.
    permissions:
      contents: write
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      # No checkout in this job, and gh finds the repository from a git
      # remote otherwise ("not a git repository").
      GH_REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      # The only files a release may carry: canon is public, so a target that
      # joins build.yaml reaches a release only once it is listed here. They
      # share one manifest, one patch set and one draft (t-tbaf, 2026-09-25).
      ASSETS: imprint_left.uf2 imprint_right.uf2 imprint_dongle.uf2 prospector.uf2
    steps:
      # Every artifact of build and version, as dist/<artifact>/<file>;
      # zmk-build.yml names each image's artifact after its shield.
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist

      - name: Collect firmware + notes
        run: |
          set -euo pipefail
          read -ra assets <<<"$ASSETS"
          mkdir -p out
          for a in "${assets[@]}"; do
            cp "dist/${a%.uf2}/$a" "out/$a"
          done
          # An image outside the list means build.yaml changed without it: stop.
          while IFS= read -r f; do
            case " $ASSETS " in
              *" ${f##*/} "*) ;;
              *)
                echo "::error::${f#dist/} is not in the release asset list (ASSETS); nothing was attached"
                exit 1
                ;;
            esac
          done < <(find dist -name '*.uf2')
          cp dist/release-notes/RELEASE_NOTES.md out/RELEASE_NOTES.md
          echo "Collected:"; ls -l out

      - name: Upload preview (dry run)
        if: github.event.inputs.dry_run == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: release-preview-${{ needs.version.outputs.version }}
          path: out/

      - name: Dry-run summary
        if: github.event.inputs.dry_run == 'true'
        run: |
          {
            echo "## Dry run: ${VERSION} (no draft written)"
            echo
            echo '```'
            cat out/RELEASE_NOTES.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # The prune below relies on VERSION being the draft's intended tag: glyph
      # refuses a next version at or under a published release (its published
      # floor).
      - name: Attach firmware to the rolling DRAFT
        if: github.event.inputs.dry_run != 'true'
        run: |
          set -euo pipefail
          read -ra assets <<<"$ASSETS"
          gh release upload "$VERSION" "${assets[@]/#/out/}" --clobber
          # --clobber replaces assets of the same name but keeps the others
          # (an old image of a target no longer listed), which publishing the
          # draft would make public: delete them every time.
          while IFS= read -r a; do
            [ -z "$a" ] && continue
            case " $ASSETS " in *" $a "*) continue ;; esac
            echo "::notice::Deleting $a from draft $VERSION: not in the release asset list"
            gh release delete-asset "$VERSION" "$a" --yes
          done < <(gh release view "$VERSION" --json assets --jq '.assets[].name')

          url="$(gh release view "$VERSION" --json url --jq .url)"
          echo "::notice::Firmware attached to draft release ${VERSION} (not published, no tag yet). Review it, then publish by hand: ${url}"
          {
            echo "## Firmware attached to draft release ${VERSION} (not published)"
            echo
            echo "The draft grows with every merge to main."
            echo "Review it, then publish by hand (that creates the tag): ${url}"
          } >> "$GITHUB_STEP_SUMMARY"
