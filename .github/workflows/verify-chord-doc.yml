name: Verify chord doc sync

# host/chord/config.tmpl を単一ソースとし、host/chord/README.md の
# ショートカット表がそこから生成された状態と一致するかを検証する。
on:
  push:
    paths:
      - host/chord/config.tmpl
      - host/chord/README.md
      - scripts/gen-chord-doc.py
      - .github/workflows/verify-chord-doc.yml
  pull_request:
    paths:
      - host/chord/config.tmpl
      - host/chord/README.md
      - scripts/gen-chord-doc.py
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check chord doc is in sync
        run: python3 scripts/gen-chord-doc.py --check
