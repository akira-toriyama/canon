name: Build

# Builds every build.yaml target through the local reusable
# .github/workflows/zmk-build.yml, which says why it is not ZMK's. The job id
# `build` is half of the required check names
# `build / Build (<board>, <shield>)` in the main ruleset; keep it.

on:
  # push only on main: a PR branch builds once, through pull_request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # ZMK is followed at main: the weekly run catches an upstream break while
  # nothing is pushed here. GitHub notifies whoever last edited the cron line,
  # and stops a public repository's schedule after 60 days without activity.
  schedule:
    - cron: "0 3 * * 1"

# Explicit, or the fleet zizmor gate fails on the default token permissions
# (excessive-permissions).
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/zmk-build.yml
