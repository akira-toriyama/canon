name: Build

# Builds every build.yaml target through the local reusable
# .github/workflows/zmk-build.yml, which says why it is not ZMK's. The job id
# `build` is half of the required check names
# `build / Build (<board>, <shield>)` in the main ruleset; keep it.

on:
  # push only on main: a PR branch builds once, through pull_request.
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # ZMK is followed at main: the weekly run shows an upstream break within a
  # week (GitHub mails the owner when a scheduled run fails).
  schedule:
    - cron: "0 3 * * 1" # Mondays 03:00 UTC

# Least privilege, made explicit — closes zizmor's excessive-permissions
# finding ahead of the fleet-wide zizmor gate (akira-toriyama/.github t-qbp1).
permissions:
  contents: read

jobs:
  build:
    uses: ./.github/workflows/zmk-build.yml
