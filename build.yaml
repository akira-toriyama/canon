# The one list of build targets: the CI and release builds
# (.github/workflows/zmk-build.yml) and scripts/build-zmk.sh read it through
# `scripts/zmk-west.sh pairs`, which takes only the board and shield of each
# include: item (other keys, such as cmake-args or snippet, are ignored). The
# release attaches only the images on the allowlist in release.yml, so a
# target added or renamed here goes there too, and into the main ruleset's
# required checks (`build / Build (<board>, <shield>)`).
---
include:
  - board: assimilator-bt
    shield: imprint_left
  - board: assimilator-bt
    shield: imprint_right
  - board: xiao_ble/nrf52840/zmk
    shield: imprint_dongle
  - board: xiao_ble/nrf52840/zmk
    shield: prospector
