# The one list of build targets: the CI and release builds
# (.github/workflows/zmk-build.yml) and scripts/build-zmk.sh read it. The
# release attaches only the images on the allowlist in release.yml, so a
# target added or renamed here goes there too.
#   imprint (the keyboard): imprint_left / imprint_right on assimilator-bt, and
#     the Imprint Dongle, imprint_dongle on xiao_ble/nrf52840/zmk
#   prospector (the Prospector Dongle): zmk-beacon's shield on
#     xiao_ble/nrf52840/zmk, a BLE observer of the Imprint Dongle's status
#     advertisement; not a split central, it never pairs or advertises
---
include:
  - board: assimilator-bt
    shield: imprint_left
  - board: assimilator-bt
    shield: imprint_right
  - board: xiao_ble/nrf52840/zmk
    shield: imprint_dongle
  - board: xiao_ble/nrf52840/zmk
    shield: prospector
