# canon = 自分の ZMK ファーム repo。1 製品 3 ターゲット:
#   imprint (キーボード): assimilator-bt + imprint_left / imprint_right
#                        / xiao_ble/nrf52840/zmk + imprint_dongle
# このファイルが board/shield 一覧の唯一のソース＝「all」ビルド（CI 通常ビルド
# .github/workflows/build.yml と Release ビルド release.yml が共通参照する）。
# 追加・改名時はここを編集するだけで両方追従する。サブセットはローカル
# build-zmk.sh の shield 指定で。
# west.yml の特殊事情（@main 固定不可・HWv2 依存）は CLAUDE.md を参照。
---
include:
  - board: assimilator-bt
    shield: imprint_left
  - board: assimilator-bt
    shield: imprint_right
  - board: xiao_ble/nrf52840/zmk
    shield: imprint_dongle
